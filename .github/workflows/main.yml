​object BlockerRepository {
private const val PREFS_NAME = "word_blocker_prefs"
private const val KEY_WORDS = "blocked_words_set"
private const val KEY_ACTIVE = "blocker_is_active"
​const val WARNING_MESSAGE_BN = "আল্লাহকে ভয় করো। আল্লাহ যিনা হারাম করেছেন।"
const val DELETE_COUNTDOWN_MS = 10 * 60 * 1000L
​fun isBlockerActive(context: Context): Boolean {
val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
return prefs.getBoolean(KEY_ACTIVE, true)
}
​fun setBlockerActive(context: Context, active: Boolean) {
val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
prefs.edit().putBoolean(KEY_ACTIVE, active).apply()
}
​fun getBlockedWords(context: Context): Set<String> {
val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
return prefs.getStringSet(KEY_WORDS, emptySet())?.toSet() ?: emptySet()
}
​fun addBlockedWord(context: Context, rawWord: String): Boolean {
val normalized = rawWord.trim()
if (normalized.isEmpty()) return false
val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
val updated = getBlockedWords(context).toMutableSet()
val added = updated.add(normalized)
if (added) {
prefs.edit().putStringSet(KEY_WORDS, updated).apply()
}
return added
}
​fun removeBlockedWord(context: Context, wordToRemove: String) {
val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
val updated = getBlockedWords(context).toMutableSet()
if (updated.remove(wordToRemove)) {
prefs.edit().putStringSet(KEY_WORDS, updated).apply()
}
}
}
​class KeepAliveForegroundService : Service() {
​companion object {
private const val CHANNEL_ID = "word_blocker_keep_alive_channel"
private const val NOTIFICATION_ID = 1001
}
​override fun onCreate() {
super.onCreate()
createNotificationChannel()
}
​override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
if (!BlockerRepository.isBlockerActive(this)) {
stopSelf()
return START_NOT_STICKY
}
​val launchIntent = Intent(this, MainActivity::class.java)
val pendingIntent = PendingIntent.getActivity(
this,
0,
launchIntent,
PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
)
​val builder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
Notification.Builder(this, CHANNEL_ID)
} else {
@Suppress("DEPRECATION")
Notification.Builder(this)
}
​val notification = builder
.setContentTitle("Word Blocker Active")
.setContentText("System-wide text protection is running.")
.setSmallIcon(android.R.drawable.ic_lock_idle_lock)
.setContentIntent(pendingIntent)
.setOngoing(true)
.build()
​startForeground(NOTIFICATION_ID, notification)
return START_STICKY
}
​override fun onBind(intent: Intent?): IBinder? = null
​private fun createNotificationChannel() {
if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
val channel = NotificationChannel(
CHANNEL_ID,
"Word Blocker Protection Service",
NotificationManager.IMPORTANCE_LOW
).apply {
description = "Keeps the system-wide word blocker active in the background."
setShowBadge(false)
}
val manager = getSystemService(NotificationManager::class.java)
manager?.createNotificationChannel(channel)
}
}
}
​class WordBlockerAccessibilityService : AccessibilityService() {
​private val mainHandler = Handler(Looper.getMainLooper())
private var activeOverlayView: View? = null
private var lastPopupTimestamp = 0L
​private val clipboardListener = ClipboardManager.OnPrimaryClipChangedListener {
if (BlockerRepository.isBlockerActive(this)) {
sanitizeClipboardIfNeeded()
}
}
​override fun onServiceConnected() {
super.onServiceConnected()
val info = AccessibilityServiceInfo().apply {
eventTypes = AccessibilityEvent.TYPE_VIEW_TEXT_CHANGED or
AccessibilityEvent.TYPE_VIEW_TEXT_SELECTION_CHANGED or
AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED or
AccessibilityEvent.TYPE_VIEW_FOCUSED
feedbackType = AccessibilityServiceInfo.FEEDBACK_GENERIC
flags = AccessibilityServiceInfo.FLAG_DEFAULT or
AccessibilityServiceInfo.FLAG_INCLUDE_NOT_IMPORTANT_VIEWS or
AccessibilityServiceInfo.FLAG_REPORT_VIEW_IDS or
AccessibilityServiceInfo.FLAG_RETRIEVE_INTERACTIVE_WINDOWS
notificationTimeout = 50L
}
serviceInfo = info
​val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as? ClipboardManager
clipboard?.addPrimaryClipChangedListener(clipboardListener)
}
​override fun onAccessibilityEvent(event: AccessibilityEvent?) {
if (event == null) return
if (!BlockerRepository.isBlockerActive(this)) return
​val packageName = event.packageName?.toString() ?: ""
if (packageName == this.packageName) return
​val blockedWords = BlockerRepository.getBlockedWords(this)
if (blockedWords.isEmpty()) return
​val sourceNode = event.source
if (sourceNode != null) {
inspectAndSanitizeNode(sourceNode, blockedWords)
}
​val rootNode = rootInActiveWindow
if (rootNode != null) {
scanWindowTreeForEditableNodes(rootNode, blockedWords, depth = 0)
}
}
​private fun scanWindowTreeForEditableNodes(
node: AccessibilityNodeInfo?,
blockedWords: Set<String>,
depth: Int
) {
if (node == null || depth > 25) return
​if (node.isEditable || node.className?.contains("EditText", ignoreCase = true) == true) {
inspectAndSanitizeNode(node, blockedWords)
}
​val childCount = node.childCount
for (i in 0 until childCount) {
val child = node.getChild(i) ?: continue
scanWindowTreeForEditableNodes(child, blockedWords, depth + 1)
}
}
​private fun inspectAndSanitizeNode(node: AccessibilityNodeInfo, blockedWords: Set<String>) {
val currentText = node.text?.toString() ?: return
if (currentText.isEmpty()) return
​if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && node.isShowingHintText) {
return
}
​var sanitizedText = currentText
var violationDetected = false
​for (forbidden in blockedWords) {
if (forbidden.isBlank()) continue
if (sanitizedText.contains(forbidden, ignoreCase = true)) {
violationDetected = true
sanitizedText = sanitizedText.replace(Regex(Regex.escape(forbidden), RegexOption.IGNORE_CASE), "")
}
}
​if (violationDetected) {
val arguments = Bundle().apply {
putCharSequence(
AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE,
sanitizedText
)
}
val replaced = node.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, arguments)
​if (!replaced) {
val clearArgs = Bundle().apply {
putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, "")
}
node.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, clearArgs)
}
​performGlobalAction(GLOBAL_ACTION_BACK)
sanitizeClipboardIfNeeded()
triggerWarningPopup()
}
}
​private fun sanitizeClipboardIfNeeded() {
val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as? ClipboardManager ?: return
val clip = clipboard.primaryClip ?: return
if (clip.itemCount == 0) return
​val pastedText = clip.getItemAt(0).coerceToText(this)?.toString() ?: return
val blockedWords = BlockerRepository.getBlockedWords(this)
​for (forbidden in blockedWords) {
if (forbidden.isNotBlank() && pastedText.contains(forbidden, ignoreCase = true)) {
if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
clipboard.clearPrimaryClip()
} else {
clipboard.setPrimaryClip(ClipData.newPlainText("", ""))
}
triggerWarningPopup()
break
}
}
}
​private fun triggerWarningPopup() {
val now = System.currentTimeMillis()
if (now - lastPopupTimestamp < 1200L) return
lastPopupTimestamp = now
​mainHandler.post {
showSystemOverlayOrToast()
}
}
​private fun showSystemOverlayOrToast() {
Toast.makeText(applicationContext, BlockerRepository.WARNING_MESSAGE_BN, Toast.LENGTH_LONG).show()
​if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
return
}
​val windowManager = getSystemService(Context.WINDOW_SERVICE) as? WindowManager ?: return
​activeOverlayView?.let {
try {
windowManager.removeView(it)
} catch (_: Exception) {
}
activeOverlayView = null
}
​val cardBackground = GradientDrawable().apply {
setColor(Color.parseColor("#B71C1C"))
cornerRadius = dpToPx(16f).toFloat()
setStroke(dpToPx(2f), Color.WHITE)
}
​val popupLayout = LinearLayout(this).apply {
orientation = LinearLayout.VERTICAL
background = cardBackground
gravity = Gravity.CENTER
val padH = dpToPx(24f)
val padV = dpToPx(20f)
setPadding(padH, padV, padH, padV)
}
​val messageView = TextView(this).apply {
text = BlockerRepository.WARNING_MESSAGE_BN
setTextColor(Color.WHITE)
setTextSize(TypedValue.COMPLEX_UNIT_SP, 20f)
setTypeface(typeface, Typeface.BOLD)
gravity = Gravity.CENTER
}
​val dismissBtn = Button(this).apply {
text = "ঠিক আছে (OK)"
setTextColor(Color.parseColor("#B71C1C"))
setBackgroundColor(Color.WHITE)
val params = LinearLayout.LayoutParams(
LinearLayout.LayoutParams.WRAP_CONTENT,
LinearLayout.LayoutParams.WRAP_CONTENT
).apply {
topMargin = dpToPx(16f)
}
layoutParams = params
setOnClickListener {
try {
windowManager.removeView(popupLayout)
} catch (_: Exception) {
}
activeOverlayView = null
}
}
​popupLayout.addView(messageView)
popupLayout.addView(dismissBtn)
​val overlayType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
} else {
@Suppress("DEPRECATION")
WindowManager.LayoutParams.TYPE_PHONE
}
​val params = WindowManager.LayoutParams(
WindowManager.LayoutParams.WRAP_CONTENT,
WindowManager.LayoutParams.WRAP_CONTENT,
overlayType,
WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON or
WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED,
PixelFormat.TRANSLUCENT
).apply {
gravity = Gravity.CENTER
}
​try {
windowManager.addView(popupLayout, params)
activeOverlayView = popupLayout
​mainHandler.postDelayed({
if (activeOverlayView === popupLayout) {
try {
windowManager.removeView(popupLayout)
} catch (: Exception) {
}
activeOverlayView = null
}
}, 5000L)
} catch (: Exception) {
}
}
​private fun dpToPx(dp: Float): Int {
return TypedValue.applyDimension(
TypedValue.COMPLEX_UNIT_DIP,
dp,
resources.displayMetrics
).toInt()
}
​override fun onInterrupt() {}
​override fun onDestroy() {
super.onDestroy()
val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as? ClipboardManager
clipboard?.removePrimaryClipChangedListener(clipboardListener)
}
}
