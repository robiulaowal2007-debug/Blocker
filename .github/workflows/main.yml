val params = LinearLayout.LayoutParams(
LinearLayout.LayoutParams.WRAP_CONTENT,
LinearLayout.LayoutParams.WRAP_CONTENT
).apply {
topMargin = dpToPx(16f)
bottomMargin = dpToPx(8f)
}
layoutParams = params
}
​dialogLayout.addView(reminderText)
dialogLayout.addView(explanationText)
dialogLayout.addView(timerText)
​val dialog = AlertDialog.Builder(this)
.setTitle("Mandatory 10-Minute Cooldown")
.setView(dialogLayout)
.setCancelable(false)
.setPositiveButton("Delete Now (Locked)", null)
.setNegativeButton("Cancel") { d, _ ->
activeDeleteTimer?.cancel()
d.dismiss()
}
.create()
​dialog.show()
​val confirmDeleteButton = dialog.getButton(AlertDialog.BUTTON_POSITIVE)
confirmDeleteButton.isEnabled = false
confirmDeleteButton.setTextColor(Color.GRAY)
​confirmDeleteButton.setOnClickListener {
BlockerRepository.removeBlockedWord(this, wordToDelete)
refreshWordList()
Toast.makeText(this, "Deleted "$wordToDelete".", Toast.LENGTH_SHORT).show()
dialog.dismiss()
}
​activeDeleteTimer = object : CountDownTimer(BlockerRepository.DELETE_COUNTDOWN_MS, 1000L) {
override fun onTick(millisUntilFinished: Long) {
val totalSecondsRemaining = (millisUntilFinished + 999L) / 1000L
val minutes = totalSecondsRemaining / 60L
val seconds = totalSecondsRemaining % 60L
timerText.text = String.format(Locale.US, "%02d:%02d", minutes, seconds)
}
​override fun onFinish() {
timerText.text = "00:00"
timerText.setTextColor(Color.parseColor("#15803D"))
confirmDeleteButton.isEnabled = true
confirmDeleteButton.text = "Confirm Delete"
confirmDeleteButton.setTextColor(Color.parseColor("#B71C1C"))
}
}.start()
}
​private fun ensureForegroundServiceState() {
val serviceIntent = Intent(this, KeepAliveForegroundService::class.java)
if (BlockerRepository.isBlockerActive(this)) {
if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
startForegroundService(serviceIntent)
} else {
startService(serviceIntent)
}
} else {
stopService(serviceIntent)
}
}
​private fun refreshPermissionStatusBanner() {
val accEnabled = isAccessibilityServiceEnabled()
val overlayEnabled = Build.VERSION.SDK_INT < Build.VERSION_CODES.M || Settings.canDrawOverlays(this)
val switchActive = BlockerRepository.isBlockerActive(this)
​when {
!switchActive -> {
statusBanner.text = "Status: Paused manually by user."
statusBanner.setBackgroundColor(Color.parseColor("#FEF3C7"))
statusBanner.setTextColor(Color.parseColor("#92400E"))
}
accEnabled && overlayEnabled -> {
statusBanner.text = "Status: ACTIVE across all apps, incognito browsers, voice input & clipboard."
statusBanner.setBackgroundColor(Color.parseColor("#DCFCE7"))
statusBanner.setTextColor(Color.parseColor("#166534"))
}
else -> {
val missing = mutableListOf<String>()
if (!accEnabled) missing.add("Accessibility Service")
if (!overlayEnabled) missing.add("Draw Over Other Apps")
statusBanner.text = "Action Needed: Please grant ${missing.joinToString(" & ")} below."
statusBanner.setBackgroundColor(Color.parseColor("#FEE2E2"))
statusBanner.setTextColor(Color.parseColor("#991B1B"))
}
}
}
​private fun refreshWordList() {
wordList.clear()
wordList.addAll(BlockerRepository.getBlockedWords(this).sorted())
wordListAdapter.notifyDataSetChanged()
}
​private fun isAccessibilityServiceEnabled(): Boolean {
val expectedComponent = ComponentName(this, WordBlockerAccessibilityService::class.java)
val enabledServices = Settings.Secure.getString(
contentResolver,
Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
) ?: return false
​val splitter = TextUtils.SimpleStringSplitter(':')
splitter.setString(enabledServices)
while (splitter.hasNext()) {
val componentString = splitter.next()
val enabledComponent = ComponentName.unflattenFromString(componentString)
if (enabledComponent != null && enabledComponent == expectedComponent) {
return true
}
}
return false
}
​private fun dpToPx(dp: Float): Int {
return TypedValue.applyDimension(
TypedValue.COMPLEX_UNIT_DIP,
dp,
resources.displayMetrics
).toInt()
}
​private class BlockedWordAdapter(
context: Context,
private val items: List<String>,
private val onDeleteClicked: (String) -> Unit
) : ArrayAdapter<String>(context, 0, items) {
​override fun getView(position: Int, convertView: View?, parent: ViewGroup): View {
val word = items[position]
val row = LinearLayout(context).apply {
orientation = LinearLayout.HORIZONTAL
gravity = Gravity.CENTER_VERTICAL
val pad = TypedValue.applyDimension(
TypedValue.COMPLEX_UNIT_DIP, 12f, context.resources.displayMetrics
).toInt()
setPadding(pad, pad, pad, pad)
}
​val wordText = TextView(context).apply {
text = word
setTextSize(TypedValue.COMPLEX_UNIT_SP, 16f)
setTextColor(Color.parseColor("#0F172A"))
layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
}
​val deleteBtn = Button(context).apply {
text = "Delete (10m Timer)"
setTextColor(Color.parseColor("#B71C1C"))
setOnClickListener { onDeleteClicked(word) }
}
​row.addView(wordText)
row.addView(deleteBtn)
return row
}
}
}
